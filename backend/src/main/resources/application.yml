server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: agent-analysis-platform

  # ---- Datasource (app_user, read-write) ----
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/agent_analysis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

  # ---- Flyway — will be enabled when DB migration automation is added ----
  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration
  #   baseline-on-migrate: true
  #   clean-disabled: true

  # ---- JPA ----
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---- Dev security (override in production) ----
  security:
    user:
      name: admin
      password: test123

  # ---- DeepSeek config (override in application-local.yml) ----
  ai:
    openai:
      api-key: ""
      base-url: "https://api.deepseek.com/v1"
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.0

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ---- App info ----
app:
  version: 0.1.0
  name: AI-Agent数据分析平台
